name: jscam

services:
  web:
    build:
      context: ./jscam
      dockerfile: Dockerfile
    image: jscam:local
    ports:
      - "8888:8080"
    environment:
      # Extra certificate names/IPs, comma-separated.
      # Example: TLS_SAN=IP:192.168.1.10,DNS:myhost.local
      TLS_SAN: ${TLS_SAN:-}
    init: true
    volumes:
      - ./jscam/index.html:/usr/share/nginx/html/index.html:ro
      - ./jscam/cam2.css:/usr/share/nginx/html/cam2.css:ro
      - ./jscam/cam2.js:/usr/share/nginx/html/cam2.js:ro
      - ./jscam/frame.js:/usr/share/nginx/html/frame.js:ro
      - ./jscam/delta.js:/usr/share/nginx/html/delta.js:ro
      - ./jscam/render.js:/usr/share/nginx/html/render.js:ro
      - ./jscam/dispatch.js:/usr/share/nginx/html/dispatch.js:ro
      - ./jscam/ui.js:/usr/share/nginx/html/ui.js:ro
      - ./jscam/camera.js:/usr/share/nginx/html/camera.js:ro
      - ./jscam/nginx.conf:/etc/nginx/conf.d/default.conf:ro

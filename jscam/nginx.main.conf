user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

# Host maps 8888 -> 8080. Detect TLS vs plain HTTP on that one port
# so both http://host:8888 and https://host:8888 work.
stream {
    upstream jscam_http {
        server 127.0.0.1:8081;
    }
    upstream jscam_https {
        server 127.0.0.1:8443;
    }

    map $ssl_preread_protocol $jscam_backend {
        ""      jscam_http;
        default jscam_https;
    }

    server {
        listen 8080;
        ssl_preread on;
        proxy_pass $jscam_backend;
        proxy_timeout 1d;
        proxy_connect_timeout 5s;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;
}
